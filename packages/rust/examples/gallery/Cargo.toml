[package]
name = "astryx-gallery"
description = "Every Astryx component in every state, as one app any shell can run"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[dependencies]
astryx-core.workspace = true
# World art draws its colors from the pixel palette.
astryx-theme-pixel = { path = "../../crates/astryx-theme-pixel" }
# The catalog reads demo props from JSON.
serde_json = "1"

[dev-dependencies]
astryx-desktop = { path = "../../crates/astryx-desktop" }
astryx-headless = { path = "../../crates/astryx-headless" }
astryx-render-soft = { path = "../../crates/astryx-render-soft" }
