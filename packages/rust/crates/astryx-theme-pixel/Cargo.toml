[package]
name = "astryx-theme-pixel"
description = "A retro pixel theme for Astryx: Galmuri pixel type, stepped corners, and hard shadows on a pixel grid"
edition.workspace = true
# The code is MIT; the bundled Galmuri fonts are under the SIL Open Font License 1.1.
license = "MIT AND OFL-1.1"
version.workspace = true

[dependencies]
astryx-core.workspace = true
astryx-image = { path = "../astryx-image", optional = true }

[features]
# The `check-palette` command line tool, which decodes PNG files.
cli = ["dep:astryx-image"]

[[bin]]
name = "check-palette"
required-features = ["cli"]

[build-dependencies]
serde_json = "1"

[dev-dependencies]
astryx-gallery = { path = "../../examples/gallery" }
astryx-headless = { path = "../astryx-headless" }
