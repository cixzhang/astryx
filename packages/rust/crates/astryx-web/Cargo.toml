[package]
name = "astryx-web"
description = "Web shell for Astryx Rust: canvas, input, and a DOM accessibility mirror"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
# Sound effects through WebAudio. Off by default to keep the bundle small.
audio = [
  "dep:astryx-audio",
  "web-sys/AudioBuffer",
  "web-sys/AudioBufferSourceNode",
  "web-sys/AudioContext",
  "web-sys/AudioDestinationNode",
  "web-sys/AudioNode",
  "web-sys/AudioScheduledSourceNode",
  "web-sys/BaseAudioContext",
]

[dependencies]
astryx-core.workspace = true
astryx-audio = { path = "../astryx-audio", optional = true }
# Fonts load at runtime as script subsets, so the wasm embeds none.
astryx-render-gl = { path = "../astryx-render-gl", default-features = false }
# Keep this version equal to the installed wasm-bindgen CLI.
wasm-bindgen = "=0.2.130"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"

[dependencies.web-sys]
version = "0.3"
features = [
  "AddEventListenerOptions",
  "CompositionEvent",
  "DataTransfer",
  "InputEvent",
  "Location",
  "Url",
  "CssStyleDeclaration",
  "Document",
  "DomRect",
  "DomRectReadOnly",
  "DomTokenList",
  "Element",
  "Event",
  "EventTarget",
  "FocusEvent",
  "FocusOptions",
  "Gamepad",
  "GamepadButton",
  "GamepadMappingType",
  "HtmlCanvasElement",
  "HtmlCollection",
  "HtmlElement",
  "HtmlHeadElement",
  "HtmlInputElement",
  "KeyboardEvent",
  "MediaQueryList",
  "MouseEvent",
  "Navigator",
  "Node",
  "Performance",
  "PointerEvent",
  "ResizeObserver",
  "ResizeObserverBoxOptions",
  "ResizeObserverEntry",
  "ResizeObserverOptions",
  "ResizeObserverSize",
  "Response",
  "WheelEvent",
  "Window",
  "console",
]

[[example]]
name = "demo"
crate-type = ["cdylib"]

[[example]]
name = "gallery"
crate-type = ["cdylib"]

[[example]]
name = "pixel"
crate-type = ["cdylib"]

[dev-dependencies]
astryx-gallery = { path = "../../examples/gallery" }
astryx-theme-pixel = { path = "../astryx-theme-pixel" }
