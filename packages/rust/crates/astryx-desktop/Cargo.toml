[package]
name = "astryx-desktop"
description = "Desktop Astryx shell: winit window, glutin GL context, GPU renderer (CPU renderer where GL is software only), keyboard and gamepad input, AccessKit"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
default = ["gamepad", "audio"]
gamepad = ["dep:gilrs"]
# Sound effects through the system's default output.
audio = ["dep:cpal", "dep:astryx-audio"]

[dependencies]
astryx-core.workspace = true
astryx-render-gl = { path = "../astryx-render-gl" }
astryx-render-soft = { path = "../astryx-render-soft" }
accesskit = "0.25.2"
accesskit_winit = "0.34.2"
gilrs = { version = "0.11.2", optional = true }
astryx-audio = { path = "../astryx-audio", optional = true }
cpal = { version = "0.16", optional = true }
glutin = "0.32.3"
glutin-winit = "0.5.0"
# Presents the CPU renderer's frames where GL runs only on the CPU.
softbuffer = { version = "0.4.8", default-features = false, features = ["x11", "x11-dlopen", "wayland", "wayland-dlopen"] }
winit = "0.30.13"

# Asks the X server whether it draws with a GPU, and gives the OpenGL thread
# a connection of its own (winit already uses both).
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
x11rb = { version = "0.13.2", features = ["shm"] }
x11-dl = "2.21.0"
# Shared memory for the CPU path's images on X11.
libc = "0.2"

[dev-dependencies]
astryx-headless = { path = "../astryx-headless" }

[[test]]
name = "window_smoke"
harness = false

[[test]]
name = "window_keys"
harness = false

[[test]]
name = "window_text"
harness = false

[[test]]
name = "window_pointer"
harness = false

[[test]]
name = "window_idle"
harness = false

[[test]]
name = "window_ime"
harness = false

[[test]]
name = "window_async"
harness = false

[[test]]
name = "window_cpu"
harness = false

[[test]]
name = "window_backend"
harness = false

[[test]]
name = "window_expose"
harness = false

[[test]]
name = "window_paths"
harness = false
