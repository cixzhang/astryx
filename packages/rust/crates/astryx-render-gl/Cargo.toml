[package]
name = "astryx-render-gl"
description = "GPU renderer for Astryx display lists: femtovg on glow, for OpenGL ES 2/3 and WebGL2"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
astryx-core.workspace = true
astryx-raster = { path = "../astryx-raster" }
femtovg = { version = "0.28.0", default-features = false }
glow = "0.18.0"

[dev-dependencies]
astryx-headless = { path = "../astryx-headless" }
astryx-render-soft = { path = "../astryx-render-soft" }
glutin = { version = "0.32.3", default-features = false, features = ["egl"] }
