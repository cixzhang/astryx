[package]
name = "astryx-render-gl"
description = "GPU renderer for Astryx display lists on glow: OpenGL ES 2/3, WebGL2, and desktop OpenGL 3.3"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
# Embeds Roboto so `new` draws text with no setup. Turn off to supply fonts.
default = ["embedded-fonts"]
embedded-fonts = ["dep:astryx-fonts"]

[dependencies]
astryx-core.workspace = true
astryx-raster = { path = "../astryx-raster" }
astryx-fonts = { path = "../astryx-fonts", optional = true }
glow = "0.18.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "WebGl2RenderingContext", "WebGlContextAttributes"] }

[dev-dependencies]
astryx-headless = { path = "../astryx-headless" }
astryx-render-soft = { path = "../astryx-render-soft" }
glutin = { version = "0.32.3", default-features = false, features = ["egl"] }
astryx-gallery = { path = "../../examples/gallery" }
