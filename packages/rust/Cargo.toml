[workspace]
resolver = "2"
members = ["crates/*", "examples/*"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
astryx-core = { path = "crates/astryx-core" }
astryx-tokens = { path = "crates/astryx-tokens" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Smaller wasm for the web shell. Symbols stay so wasm-bindgen can read them.
[profile.web-release]
inherits = "release"
opt-level = "s"
lto = "fat"
panic = "abort"
strip = false
