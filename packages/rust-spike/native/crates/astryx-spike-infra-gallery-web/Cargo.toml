[package]
name = "astryx-spike-infra-gallery-web"
description = "The infra gallery in the browser (wasm)"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
astryx-core.workspace = true
astryx-web.workspace = true
astryx-spike-infra-gallery = { path = "../astryx-spike-infra-gallery" }
# Keep equal to the installed wasm-bindgen CLI (same pin as astryx-web).
wasm-bindgen = "=0.2.130"
web-sys = { version = "0.3", features = ["Location", "UrlSearchParams", "Window"] }
